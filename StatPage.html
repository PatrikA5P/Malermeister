
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borer Atelier A | KI Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .brand-font { font-family: 'Oswald', sans-serif; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900">
    <header class="fixed w-full z-50 bg-white/80 backdrop-blur-md py-4 border-b border-zinc-100">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-[#7c8d2f] rounded flex items-center justify-center text-white font-black">B</div>
                <span class="brand-font text-xl uppercase tracking-tighter">Maler <span class="text-[#7c8d2f]">Borer</span></span>
            </div>
            <nav class="hidden md:flex gap-8 text-[10px] font-black uppercase tracking-widest text-zinc-400">
                <a href="index.html" class="hover:text-black">Zurück</a>
                <span class="text-[#7c8d2f]">Atelier A</span>
            </nav>
        </div>
    </header>

    <main class="pt-32 pb-20">
        <div class="container mx-auto px-6">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-12">
                <!-- Canvas Area -->
                <div class="lg:col-span-3">
                    <div class="relative bg-white p-4 rounded-[3rem] shadow-2xl border border-zinc-100 aspect-video flex items-center justify-center overflow-hidden">
                        <div class="text-center">
                            <div class="w-20 h-20 bg-zinc-100 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">🖼️</div>
                            <h2 class="text-2xl font-black brand-font uppercase mb-2">KI Visualisierer</h2>
                            <p class="text-zinc-400 text-sm max-w-xs mx-auto mb-8">Laden Sie ein Foto hoch, um Wände digital zu streichen.</p>
                            <button class="bg-zinc-900 text-white px-10 py-5 rounded-2xl font-black uppercase tracking-widest text-[10px] hover:bg-[#7c8d2f] transition-all">Foto wählen</button>
                        </div>
                    </div>
                </div>
                <!-- UI Area -->
                <div class="lg:col-span-1">
                    <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-zinc-100 h-full">
                        <h3 class="text-lg font-black brand-font uppercase mb-8">Einstellungen</h3>
                        <div class="space-y-6">
                            <div class="p-4 bg-zinc-50 rounded-2xl border border-zinc-100">
                                <p class="text-[9px] font-black uppercase tracking-widest text-zinc-400 mb-4">Farbpalette</p>
                                <div class="flex gap-2">
                                    <div class="w-8 h-8 rounded-lg bg-[#7c8d2f]"></div>
                                    <div class="w-8 h-8 rounded-lg bg-[#f4f4f0] border border-zinc-200"></div>
                                    <div class="w-8 h-8 rounded-lg bg-[#3a3b35]"></div>
                                    <div class="w-8 h-8 rounded-lg bg-[#d4c9b1]"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
