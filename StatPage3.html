<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maler Borer - Industrial Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        .brand-font { font-family: 'Oswald', sans-serif; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-black text-white selection:bg-[#7c8d2f]">
    <section class="relative h-screen flex items-center pt-20 overflow-hidden">
        <div class="absolute top-0 right-0 w-2/3 h-full overflow-hidden opacity-30">
          <img src="https://images.unsplash.com/photo-1565008447742-97f6f38c985c?q=80&w=2070" class="w-full h-full object-cover" alt="Steel & Concrete">
        </div>
        <div class="container mx-auto px-6 relative z-10">
          <div class="max-w-4xl">
            <h1 class="text-8xl md:text-[12rem] font-black text-white leading-[0.8] tracking-tighter uppercase brand-font mb-10">
              BUILD <br/> <span class="text-[#7c8d2f]">BOLD.</span>
            </h1>
            <div class="flex flex-col md:flex-row items-center gap-10">
              <div class="h-px w-32 bg-[#7c8d2f] hidden md:block"></div>
              <p class="text-zinc-400 text-xl font-medium max-w-xl">Maler- & Gipsergeschäft Borer. Industrieller Standard für moderne Architektur.</p>
              <a href="#" class="px-8 py-8 bg-[#7c8d2f] text-white rounded-full font-black uppercase tracking-widest text-xs hover:scale-110 transition-transform flex items-center justify-center shrink-0 aspect-square">Start</a>
            </div>
          </div>
        </div>
        <div class="absolute bottom-10 left-6 text-white/5 font-black text-[15rem] select-none leading-none uppercase">BORER</div>
    </section>

    <section class="py-32 bg-zinc-900">
        <div class="container mx-auto px-6 text-center">
            <h2 class="text-4xl font-black brand-font uppercase mb-12">Roh. Echt. Präzise.</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="bg-black p-12 border border-zinc-800">
                    <span class="text-[#7c8d2f] font-black text-5xl brand-font">01</span>
                    <h3 class="text-xl font-bold uppercase mt-6 mb-4">Glatte Wände</h3>
                    <p class="text-zinc-500 text-sm">Präzision bis in den letzten Winkel.</p>
                </div>
                <div class="bg-black p-12 border border-zinc-800">
                    <span class="text-[#7c8d2f] font-black text-5xl brand-font">02</span>
                    <h3 class="text-xl font-bold uppercase mt-6 mb-4">Betonoptik</h3>
                    <p class="text-zinc-500 text-sm">Authentisches Industrial-Feeling.</p>
                </div>
                <div class="bg-black p-12 border border-zinc-800">
                    <span class="text-[#7c8d2f] font-black text-5xl brand-font">03</span>
                    <h3 class="text-xl font-bold uppercase mt-6 mb-4">Trockenbau</h3>
                    <p class="text-zinc-500 text-sm">Flexible Raumaufteilung.</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
