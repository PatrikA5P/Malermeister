<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maler Borer - Modern Atmosphere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        .brand-font { font-family: 'Oswald', sans-serif; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#FCFCFA] text-zinc-900 selection:bg-[#7c8d2f]/10">
    <section class="min-h-screen flex items-center py-20 overflow-hidden">
        <div class="container mx-auto px-6">
          <div class="flex flex-col lg:flex-row items-center gap-20">
            <div class="flex-1">
              <div class="inline-block bg-[#7c8d2f]/10 text-[#7c8d2f] px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest mb-8">Meisterbetrieb seit 2010</div>
              <h1 class="text-6xl md:text-8xl font-black text-zinc-900 leading-[0.9] mb-10 brand-font uppercase">
                Gefühl für <br/><span class="text-[#7c8d2f] italic">Räume.</span>
              </h1>
              <p class="text-zinc-500 text-xl leading-relaxed max-w-lg mb-12">Wir schaffen Atmosphäre durch Farbe und Struktur. Ehrlich, sauber und nachhaltig für Ihr Zuhause.</p>
              <div class="flex flex-wrap gap-4">
                <a href="#" class="bg-zinc-900 text-white px-10 py-5 rounded-2xl font-black uppercase tracking-widest text-xs hover:bg-[#7c8d2f] transition-all shadow-xl shadow-zinc-200">Beratung</a>
                <a href="#" class="bg-white border border-zinc-100 text-zinc-400 px-10 py-5 rounded-2xl font-black uppercase tracking-widest text-xs hover:text-zinc-900 transition-all">Leistungen</a>
              </div>
            </div>
            <div class="flex-1 relative">
               <div class="absolute -inset-4 bg-[#7c8d2f]/10 rounded-[4rem] blur-3xl opacity-30"></div>
               <img src="https://images.unsplash.com/photo-1595844730298-b960ff98fee0?q=80&w=1200" class="relative z-10 w-full aspect-square object-cover rounded-[3rem] shadow-2xl" alt="Moderner Maler">
            </div>
          </div>
        </div>
    </section>
</body>
</html>
