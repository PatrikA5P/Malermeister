
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maler Borer - Pure Minimalist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        .brand-font { font-family: 'Oswald', sans-serif; }
        body { font-family: 'Inter', sans-serif; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .animate-marquee { animation: marquee 40s linear infinite; }
    </style>
</head>
<body class="bg-[#f2f2f2] text-[#1a1a1a]">
    <header class="fixed w-full z-50 p-6 flex justify-between items-center mix-blend-difference text-white">
        <span class="brand-font font-black text-2xl uppercase italic">Borer.</span>
    </header>

    <section class="min-h-screen flex flex-col lg:flex-row border-b border-black/10">
        <div class="lg:w-1/2 flex flex-col justify-center p-12 lg:p-24 bg-white">
          <div class="mb-12">
            <span class="text-[10px] font-black uppercase tracking-[0.5em] text-olive-600">Established 2010</span>
          </div>
          <h1 class="text-8xl lg:text-[12rem] font-black leading-[0.8] tracking-tighter uppercase brand-font mb-12">
            Pure <br/><span class="text-[#7c8d2f]">Borer.</span>
          </h1>
          <p class="text-xl text-zinc-400 max-w-sm mb-12 font-medium">
            Handwerk in seiner ehrlichsten Form. Keine Kompromisse, nur Qualität.
          </p>
          <div>
            <a href="#" class="inline-block bg-black text-white px-12 py-5 font-black uppercase tracking-widest text-[10px] hover:bg-[#7c8d2f] transition-all">Anfrage starten</a>
          </div>
        </div>
        <div class="lg:w-1/2 relative bg-zinc-900 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1565008447742-97f6f38c985c?q=80&w=2070" class="w-full h-full object-cover grayscale opacity-50" alt="Texture">
          <div class="absolute top-1/2 left-0 -translate-y-1/2 -translate-x-12 rotate-90 text-[15rem] font-black text-white/5 whitespace-nowrap pointer-events-none uppercase">
            CRAFTSMAN
          </div>
        </div>
    </section>

    <section class="py-24 bg-white overflow-hidden">
        <div class="flex whitespace-nowrap animate-marquee">
            <div class="flex gap-8 px-4">
              <div class="w-64 h-96 bg-[#7c8d2f] rounded-sm p-6 flex flex-col justify-end text-white">
                <span class="font-mono text-xs">#7C8D2F</span>
                <span class="font-black text-2xl uppercase">Borer Olive</span>
              </div>
              <div class="w-64 h-96 bg-zinc-900 rounded-sm p-6 flex flex-col justify-end text-white">
                <span class="font-mono text-xs">#0D1005</span>
                <span class="font-black text-2xl uppercase">Deep Stone</span>
              </div>
              <div class="w-64 h-96 bg-zinc-200 rounded-sm p-6 flex flex-col justify-end text-black">
                <span class="font-mono text-xs">#ECEEE3</span>
                <span class="font-black text-2xl uppercase">Light Plaster</span>
              </div>
            </div>
            <!-- Duplicate for Marquee -->
            <div class="flex gap-8 px-4">
                <div class="w-64 h-96 bg-[#7c8d2f] rounded-sm p-6 flex flex-col justify-end text-white">
                  <span class="font-mono text-xs">#7C8D2F</span>
                  <span class="font-black text-2xl uppercase">Borer Olive</span>
                </div>
                <div class="w-64 h-96 bg-zinc-900 rounded-sm p-6 flex flex-col justify-end text-white">
                  <span class="font-mono text-xs">#0D1005</span>
                  <span class="font-black text-2xl uppercase">Deep Stone</span>
                </div>
                <div class="w-64 h-96 bg-zinc-200 rounded-sm p-6 flex flex-col justify-end text-black">
                  <span class="font-mono text-xs">#ECEEE3</span>
                  <span class="font-black text-2xl uppercase">Light Plaster</span>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
