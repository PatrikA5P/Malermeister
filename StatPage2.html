<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maler Borer - Exklusives Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        .brand-font { font-family: 'Oswald', sans-serif; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-zinc-900 selection:bg-[#7c8d2f]/20">
    <header class="fixed w-full z-50 p-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-[#7c8d2f] rounded flex items-center justify-center text-white font-black">B</div>
            <span class="brand-font font-black text-xl uppercase tracking-tighter">Borer <span class="text-[#7c8d2f]">Atelier</span></span>
        </div>
    </header>

    <section class="min-h-screen flex items-center justify-center bg-zinc-50 px-6 pt-20">
        <div class="max-w-5xl w-full grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
          <div>
            <span class="text-[#7c8d2f] font-bold tracking-[0.4em] text-[10px] uppercase mb-8 block">Exklusiv & Präzise</span>
            <h1 class="text-7xl lg:text-8xl font-black leading-none mb-10 tracking-tight uppercase brand-font">
              Farbe & <br/><span class="text-[#7c8d2f] italic">Charakter.</span>
            </h1>
            <p class="text-zinc-500 text-lg mb-12 max-w-md leading-relaxed">
                Zeitlose Raumgestaltung durch meisterhaftes Handwerk. Wir definieren Oberflächen neu – Schicht für Schicht.
            </p>
            <div class="flex space-x-8">
                <a href="#" class="text-black font-black uppercase text-xs tracking-widest border-b-2 border-black pb-2 hover:text-[#7c8d2f] hover:border-[#7c8d2f] transition-all">Anfrage starten</a>
                <a href="#" class="text-zinc-400 font-black uppercase text-xs tracking-widest hover:text-black transition-all">Portfolio</a>
            </div>
          </div>
          <div class="relative aspect-[4/5] bg-zinc-200 overflow-hidden rounded-sm group shadow-2xl">
            <img src="https://images.unsplash.com/photo-1589939705384-5185137a7f0f?q=80&w=1200" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-1000 scale-105 group-hover:scale-100" alt="Maler Arbeit">
          </div>
        </div>
    </section>

    <footer class="py-12 bg-zinc-50 border-t border-zinc-100">
        <div class="container mx-auto px-6 text-center">
            <p class="text-[10px] font-black uppercase tracking-widest text-zinc-400">© 2025 Maler- & Gipsergeschäft Borer. Alle Rechte vorbehalten.</p>
        </div>
    </footer>
</body>
</html>
